# ---------------- cart recovery ----------------
- id: recovery-opted-in-returns
  category: recovery
  lang: hinglish
  customer: C0001
  steps: ["windproof umbrella dikhao", "pehla wala add kar do", {abandon: true}, "haan, order kar do", {pay: true}]
  expect: {recovery_status: dry_run, order_created: true, confirmation_sent: true, tools_ok: [start_checkout]}

- id: recovery-bargained-discount
  category: recovery
  lang: en
  customer: C0004
  steps: ["show me sarees", "add the first one", "can I get 10% off?", {abandon: true}]
  expect: {recovery_status: dry_run, recovery_contains: ["10%"]}

- id: recovery-visitor-email
  category: recovery
  lang: en
  customer: C0002
  steps: ["compact umbrella", "add the first one", {contact: visitor@gmail.com, consent: true}, {abandon: true}]
  expect: {recovery_status: dry_run, recovery_to: visitor@gmail.com}

- id: recovery-visitor-no-consent
  category: recovery
  lang: en
  customer: C0002
  steps: ["compact umbrella", "add the first one", {contact: visitor@gmail.com, consent: false}, {abandon: true}]
  expect: {recovery_status: blocked, recovery_detail: no_consent}

- id: recovery-no-consent
  category: recovery
  lang: en
  customer: C0002
  steps: ["compact umbrella", "add the first one", {abandon: true}]
  expect: {recovery_status: blocked, recovery_detail: no_consent}

- id: recovery-only-once
  category: recovery
  lang: en
  customer: C0004
  steps: ["compact umbrella", "add the first one", {abandon: true}, "add the second one too", {abandon: true}]
  expect: {recovery_status: dry_run, recovery_count: 1}

- id: recovery-hindi
  category: recovery
  lang: hi
  customer: C0003
  steps: ["एक छाता चाहिए", "पहला वाला जोड़ दो", {abandon: true}]
  expect: {recovery_status: dry_run, recovery_language: hi}

- id: recovery-anonymous-cart
  category: recovery
  lang: en
  customer: null
  steps: ["compact umbrella", "add the first one", {abandon: true}]
  expect: {recovery_count: 0}

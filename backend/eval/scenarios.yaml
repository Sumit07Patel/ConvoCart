# Phase 7 scenarios. Simulated shoppers are scripts (not a model), so runs are free and repeatable.
# Each scenario runs on its own fresh copy of the seeded store.
#
# steps: a string is a shopper message in the web chat; dicts are events:
#   {abandon: true}                   cart idle for 2 h, then the store's abandoned-cart job runs (come-back email)
#   {contact: addr, consent: true}    the visitor types their own address into the cart panel
#   {pay: true}                       payment provider confirms payment (order.paid -> order confirmation email)
# expect keys: route, handover, tools_ok, tool_errors, no_tool_ok, cart_items_min, reply_contains,
#   reply_contains_any, reply_not_contains, final_language, recovery_status, recovery_detail, recovery_count,
#   recovery_language, recovery_contains, recovery_to, order_created, confirmation_sent
# Guardrail violations are checked automatically for every scenario (see run_scenarios.py).

# ---------------- shopping ----------------
- id: shop-en-search
  category: shopping
  lang: en
  customer: C0004
  steps: ["lightweight waterproof jacket for the monsoon under 3000"]
  expect: {route: advisor, handover: false, tools_ok: [search_products], reply_contains: ["₹"], final_language: en}


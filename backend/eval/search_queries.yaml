# Phase 3 search eval. A query is a hit when at least one of the top 4 results matches `expect`.
# `expect` describes what the shopper actually wants (written by hand, independent of the parser):
#   category: one or a list;  tags_any / tags_all: catalog tags;  max_price / min_price;  gender;  ids: exact ids
# lang: en | hinglish | hi  (reported separately)
# set: tuned (default) = written while building the lexicon, so optimistic;
#      holdout = written after the lexicon was frozen and NOT used to tune it. Reported separately.

- {id: s01, lang: en, q: "lightweight waterproof jacket for the monsoon under 3000", expect: {category: rain jacket, tags_any: [waterproof], max_price: 3000}}

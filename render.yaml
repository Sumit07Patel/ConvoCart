# Render blueprint for the free-tier demo: one web service (agent + in-process store on SQLite,
# reseeded at boot) and a static site for the chat UI. Free services sleep when idle and start
# slowly; keep the recorded demo video as the backup.
services:
  - type: web
    name: convocart-agent
    runtime: docker
    # paths are relative to the repository root
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "python -m scripts.seed --force && uvicorn convocart.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - {key: DATABASE_URL, value: "sqlite:////tmp/convocart.db"}
      - {key: STORE_MODE, value: local}
      - {key: LLM_PROVIDER, value: groq}
      - {key: LLM_MODEL, value: openai/gpt-oss-120b}
      - {key: CHAT_LIMIT_PER_VISITOR, value: "30"}   # messages per visitor per 10 minutes
      - {key: CHAT_DAILY_LIMIT, value: "300"}        # messages per day for the whole demo (free model quota)
      - {key: LLM_API_KEY, sync: false}
      - {key: ADMIN_TOKEN, generateValue: true}
      - {key: STORE_API_KEY, generateValue: true}
      - {key: STORE_WEBHOOK_SECRET, generateValue: true}
      - {key: EMAIL_ADDRESS, sync: false}          # Gmail address that sends the shopper emails
      - {key: EMAIL_APP_PASSWORD, sync: false}     # Gmail app password (not your normal password)
      - {key: EMAIL_FROM, sync: false}             # optional sender shown, e.g. you+kesarlane@gmail.com
      - {key: DEMO_LINKED_EMAIL, sync: false}      # optional: your own address, linked to shopper C0001
      - {key: PUBLIC_WEB_URL, value: "https://convocart-web.onrender.com"}   # link back to the chat in emails
      - {key: CORS_ORIGINS, value: "*"}
  - type: web
    name: convocart-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - {key: VITE_API_URL, value: "https://convocart-agent.onrender.com"}
